# Render Blueprint para Ciudad Pastel (Monorepo)
# Permite desplegar la API y el Frontend Web en Render con configuración automática.
services:
  # -------------------------------------------------------------
  # 1. API Backend (Node.js / Express + Firebase Admin)
  # -------------------------------------------------------------
  - type: web
    name: ciudad-pastel-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --workspace=apps/api
    startCommand: npm start --workspace=apps/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      # Alternativa si no usas Secret File:
      # - key: FIREBASE_SERVICE_ACCOUNT
      #   sync: false
    secretFiles:
      - name: firebase-service-account.json

  # -------------------------------------------------------------
  # 2. Frontend Web (Vite + React 19 SPA)
  # -------------------------------------------------------------
  - type: web
    name: ciudad-pastel-web
    runtime: static
    plan: free
    buildCommand: npm install --workspace=apps/web && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    routes:
      # Regla de reescritura SPA (evita errores 404 al recargar rutas como /cursos, /login, etc.)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

