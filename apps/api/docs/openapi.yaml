openapi: 3.0.3

info:
  title: Ciudad Pastel API
  version: 1.0.0
  description: API for Ciudad Pastel administrative and public operations.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Courses
    description: Course administration

paths:

  /admin/courses:
    get:
      tags:
        - Courses
      summary: List administrative courses
      description: Returns all courses, including draft, published, and archived courses, optionally filtered by status.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter courses by status. Omit to return all courses.
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
      responses:
        "200":
          description: Courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          description: Unsupported status filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "500":
          description: Internal server error.

    post:
      tags:
        - Courses
      summary: Create a course
      description: Creates a new course. New courses are always created as draft.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"

            example:
              name: Pastelería Básica
              summary: Aprende los fundamentos de la pastelería.
              description: En este curso aprenderás técnicas fundamentales de preparación y decoración.
              imageUrl: null
              learningOutcomes:
                - Preparar masas básicas
                - Aplicar técnicas básicas de decoración
              requiredMaterials:
                - Delantal
                - Espátula

      responses:

        "201":
          description: Course created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

        "400":
          description: Invalid course data.

        "401":
          description: Authentication required or invalid token.

        "403":
          description: Administrator privileges required.

        "500":
          description: Internal server error.

  /admin/courses/{id}:
    get:
      tags:
        - Courses
      summary: Get an administrative course
      description: Returns a course using its Firestore document ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      responses:
        "200":
          description: Course retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

    put:
      tags:
        - Courses
      summary: Update an administrative course
      description: >-
        Replaces the editable base course information using the creation validation rules.
        Name, summary, and description are required. Omitted imageUrl defaults to null,
        and omitted learningOutcomes and requiredMaterials default to empty arrays.
        Omitted planning data (capacity, price, instructor, schedule) is cleared to null; this is rejected
        with 400 when the course is published, because a published course must keep its planning data complete.
        Client-supplied id, status, createdAt, and updatedAt are ignored.
        The existing ID, status, and createdAt are preserved; updatedAt is generated by the server.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "200":
          description: Course updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course data.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{id}/status:
    patch:
      tags:
        - Courses
      summary: Change an administrative course status
      description: >-
        Allows draft to published, published to draft, and draft or published to archived.
        Archived to draft restores (unarchives) the course as a draft, hidden from the public listing until explicitly published.
        Archived to published and same-state transitions are rejected.
        Publishing requires the course planning data (capacity, price, instructor and schedule) to be complete.
        Only status and the server-generated updatedAt change; course content, ID, and createdAt are preserved.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseStatusRequest"
      responses:
        "200":
          description: Course status changed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid status input or request body, or the course cannot be published because its planning data is incomplete.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Status transition is not allowed.
        "500":
          description: Internal server error.

  /courses:
    get:
      tags:
        - Courses
      summary: List published courses
      description: Returns only published courses. Authentication is not required; draft and archived courses are excluded.
      security: []
      responses:
        "200":
          description: Published courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "500":
          description: Internal server error.

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    UpdateCourseStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - published
            - archived

    CreateCourseRequest:
      type: object

      required:
        - name
        - summary
        - description

      properties:

        name:
          type: string
          minLength: 3
          maxLength: 120

        summary:
          type: string
          minLength: 10
          maxLength: 240

        description:
          type: string
          minLength: 20
          maxLength: 5000

        imageUrl:
          type: string
          format: uri
          nullable: true

        learningOutcomes:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 15

        requiredMaterials:
          type: array
          items:
            type: string
            maxLength: 150
          maxItems: 30

        capacity:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Maximum number of students. Required to publish the course.

        price:
          type: integer
          minimum: 0
          maximum: 10000000
          nullable: true
          description: Course price in whole Costa Rican colones (CRC). Required to publish the course.

        instructor:
          type: string
          minLength: 3
          maxLength: 120
          nullable: true
          description: Name of the person who teaches the course. Required to publish the course.

        schedule:
          $ref: "#/components/schemas/CourseSchedule"

    CourseSchedule:
      type: object
      nullable: true
      description: Course dates and time of day. Required to publish the course.
      required:
        - startDate
        - description
      properties:
        startDate:
          type: string
          format: date
          example: "2026-11-03"
        endDate:
          type: string
          format: date
          nullable: true
          description: Optional. Must not be earlier than startDate.
          example: "2026-11-24"
        description:
          type: string
          minLength: 3
          maxLength: 200
          example: Martes de 6:00 p. m. a 9:00 p. m.

    Course:
      allOf:
        - $ref: "#/components/schemas/CreateCourseRequest"

        - type: object
          properties:

            id:
              type: string
              format: uuid

            status:
              type: string
              enum:
                - draft
                - published
                - archived

            createdAt:
              type: string
              format: date-time

            updatedAt:
              type: string
              format: date-time
