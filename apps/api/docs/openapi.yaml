openapi: 3.0.3

info:
  title: Ciudad Pastel API
  version: 1.0.0
  description: API for Ciudad Pastel administrative and public operations.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Student access
    description: Public student enrollment verification (CIU-119)
  - name: Courses
    description: Course administration
  - name: Recipe Books
    description: Recipe book PDF administration
  - name: Enrollment requests
    description: Enrollment requests from visitors (HU-A05)
  - name: Enrollments
    description: Confirmed enrollments registered by the administrator (HU-A09)
  - name: Products
    description: Public product catalog operations (HU-T01)

paths:
  /products:
    get:
      tags: [Products]
      summary: Retrieve the public product catalog (CIU-132)
      security: []
      description: >-
        Public endpoint; no authentication required. Returns the list of all
        published products sorted by category display order and product name.
        Cached in memory for 60 seconds.
      responses:
        "200":
          description: List of published products in the catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"
        "500":
          description: Safe internal failure when loading the catalog.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Could not load the product catalog.

  /student-access/verify:
    post:
      tags: [Student access]
      summary: Verify student enrollment and issue temporary access
      security: []
      description: >-
        Public endpoint; no Firebase account or administrative authentication.
        Name is collected but is not used for exact matching. Normalized ID and
        phone must match the same active confirmed enrollment; cancelled
        enrollments are excluded. Spaces, hyphens and other non-digit characters
        are removed using existing enrollment normalization. National IDs have
        9 digits starting with 1-7; DIMEX has 11 or 12 digits; phone has 8 digits.
        The signed token expires after 900 seconds and is not a permanent account.
        Only courses with recipe books appear; each course may currently have
        multiple recipe books. Valid identity with no books returns courses [].
        Material access re-checks active enrollment even with a valid token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, idNumber, phone]
              properties:
                fullName:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Trimmed with collapsed whitespace; not an authentication factor.
                idNumber:
                  type: string
                  example: 1-0538-0021
                phone:
                  type: string
                  example: 8888 7777
      responses:
        "200":
          description: Successful verification, including when courses is empty.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, courses]
                properties:
                  accessToken:
                    type: string
                    description: Temporary signed token; contains no name, phone or ID number.
                  expiresIn:
                    type: integer
                    enum: [900]
                  courses:
                    type: array
                    items:
                      type: object
                      required: [id, name, recipeBooks]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        recipeBooks:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required: [id, title, fileName, sizeBytes]
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              fileName:
                                type: string
                              sizeBytes:
                                type: integer
        "400":
          description: Invalid input, malformed JSON or body over 100 KB; errors do not disclose enrollment existence.
          content:
            application/json:
              schema:
                type: object
                required: [message, errors]
                properties:
                  message:
                    type: string
                    example: Student verification validation failed.
                  errors:
                    type: array
                    items:
                      type: string
        "401":
          description: No matching active enrollment; the same response for every identity mismatch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: ["We couldn't find an enrollment with this data."]
        "429":
          description: More than 5 attempts per IP in 15 minutes; dedicated verification counter.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: [Too many verification attempts. Please try again later.]
        "500":
          description: Safe internal failure, including missing token secret configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: [Could not verify student access.]

  /student-access/courses/{courseId}/recipe-books/{recipeBookId}/file:
    get:
      tags: [Student access]
      summary: View an authorized course recipe-book PDF (CIU-121)
      description: >-
        Requires the temporary student token issued by POST /student-access/verify,
        not Firebase/admin authentication. The requested course must be in the
        token courseIds, and at least one enrollment identified by its enrollmentIds
        must currently exist, be enrolled, and belong to that course. Token validity
        alone is insufficient. Cancellation revokes practical access on subsequent
        requests immediately without waiting for token expiry, unless another
        represented active enrollment grants access. Returns the specifically
        requested PDF using existing HU-A03 ownership and storage checks.
        This route refines the original singular CIU-121 wording because HU-A03
        supports multiple recipe books per course; recipeBookId comes from
        courses[].recipeBooks[]. No recipe book is arbitrarily selected.
      security:
        - studentAccessBearer: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized PDF bytes, viewed inline; no enrollment or storage metadata.
          headers:
            Content-Disposition:
              description: Inline disposition with safely quoted/encoded stored filename.
              schema:
                type: string
                example: 'inline; filename="macarons.pdf"'
            Content-Length:
              description: Actual PDF Buffer length in bytes.
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                enum: ["private, no-store"]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Missing Authorization, wrong scheme, missing/malformed token, invalid signature or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Invalid or expired student access token.
        "403":
          description: Course absent from token claims or no represented enrollment remains active for it, including cancellation/deletion/reassignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Student access is not authorized for this course.
        "404":
          description: Course/book missing, book belongs to another course, or binary missing; same safe response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Recipe book not found.
        "500":
          description: Missing/invalid server token configuration or unexpected repository/storage failure; no internal details disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Could not retrieve recipe book.

  /admin/courses:
    get:
      tags:
        - Courses
      summary: List administrative courses
      description: Returns all courses, including draft, published, and archived courses, optionally filtered by status.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter courses by status. Omit to return all courses.
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
      responses:
        "200":
          description: Courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          description: Unsupported status filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "500":
          description: Internal server error.

    post:
      tags:
        - Courses
      summary: Create a course
      description: Creates a new course. New courses are always created as draft.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"

            example:
              name: Pastelería Básica
              summary: Aprende los fundamentos de la pastelería.
              description: En este curso aprenderás técnicas fundamentales de preparación y decoración.
              imageUrl: null
              learningOutcomes:
                - Preparar masas básicas
                - Aplicar técnicas básicas de decoración
              requiredMaterials:
                - Delantal
                - Espátula

      responses:
        "201":
          description: Course created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

        "400":
          description: Invalid course data.

        "401":
          description: Authentication required or invalid token.

        "403":
          description: Administrator privileges required.

        "500":
          description: Internal server error.

  /admin/courses/{id}:
    get:
      tags:
        - Courses
      summary: Get an administrative course
      description: Returns a course using its Firestore document ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      responses:
        "200":
          description: Course retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

    put:
      tags:
        - Courses
      summary: Update an administrative course
      description: >-
        Replaces the editable base course information using the creation validation rules.
        Name, summary, and description are required. Omitted imageUrl defaults to null,
        and omitted learningOutcomes and requiredMaterials default to empty arrays.
        Omitted optional scalars and schedule are cleared to null. Only clearing price on a published course
        is rejected with 400; capacity, schedule and instructor may be cleared.
        Client-supplied id, status, createdAt, and updatedAt are ignored.
        The existing ID, status, and createdAt are preserved; updatedAt is generated by the server.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "200":
          description: Course updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course data.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{id}/status:
    patch:
      tags:
        - Courses
      summary: Change an administrative course status
      description: >-
        Allows draft to published, published to draft, and draft or published to archived.
        Archived to draft restores (unarchives) the course as a draft, hidden from the public listing until explicitly published.
        Archived to published and same-state transitions are rejected.
        Publishing requires only a valid non-negative integer price in CRC; zero means free. All other optional fields may be null.
        Only status and the server-generated updatedAt change; course content, ID, and createdAt are preserved.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseStatusRequest"
      responses:
        "200":
          description: Course status changed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid status input or request body, or missing/invalid publication price. Missing price is reported in the errors array as price is required for a published course.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Status transition is not allowed.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books:
    post:
      tags:
        - Recipe Books
      summary: Upload and link a recipe book PDF
      description: Uploads a PDF recipe book and links it to an existing course.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course to link the recipe book to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file of the recipe book (max 20 MiB).
                title:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Optional descriptive title. Defaults to the base file name.
      responses:
        "201":
          description: Recipe book created and linked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeBook"
        "400":
          description: Validation failed (missing file, non-PDF, invalid signature, empty file, or invalid title).
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Course already has reached the maximum of 10 recipe books.
        "413":
          description: File size exceeds the maximum allowed limit.
        "500":
          description: Internal server error.

    get:
      tags:
        - Recipe Books
      summary: List recipe books for a course
      description: Returns all recipe books linked to the specified course, sorted newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
      responses:
        "200":
          description: Recipe books retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeBook"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books/{recipeBookId}/file:
    get:
      tags:
        - Recipe Books
      summary: Download recipe book PDF
      description: Streams the PDF file of the specified recipe book as an attachment.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          description: ID of the recipe book.
          schema:
            type: string
      responses:
        "200":
          description: Recipe book PDF file downloaded successfully.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course or recipe book not found.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books/{recipeBookId}:
    delete:
      tags:
        - Recipe Books
      summary: Delete a recipe book
      description: Permanently deletes a recipe book record and its stored binary file chunks.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          description: ID of the recipe book.
          schema:
            type: string
      responses:
        "204":
          description: Recipe book deleted successfully.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course or recipe book not found.
        "500":
          description: Internal server error.


  /courses:
    get:
      tags:
        - Courses
      summary: List published courses
      description: Returns only published courses sorted by start date ascending. Authentication is not required; draft and archived courses are excluded.
      security: []
      responses:
        "200":
          description: Published courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCourse"
        "500":
          description: Internal server error.

  /courses/{id}:
    get:
      tags:
        - Courses
      summary: Get published course details
      description: Returns public course details by identifier. Only published courses are returned; drafts, archived, or nonexistent courses return 404.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Unique identifier of the course.
      responses:
        "200":
          description: Public course details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCourse"
        "404":
          description: Course not found or not published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Course not found.
        "500":
          description: Internal server error.

  /courses/{id}/enrollment-requests:
    post:
      tags:
        - Enrollment requests
      summary: Submit an enrollment request (public)
      description: >-
        HU-A05. A visitor without an account asks to enroll in a published course. The request is saved as
        pending and linked to the course; it never creates a confirmed enrollment (payment is coordinated
        outside the platform). Only fullName, idType, idNumber and phone are accepted; other fields are ignored.
        Spaces and hyphens in idNumber and phone are removed. A national ID has 9 digits and starts with 1-7;
        a DIMEX has 11 or 12 digits; the phone has exactly 8 digits. One active (pending or contacted) request
        per ID number and course; a discarded request does not block a new one.
        Limited to 5 requests every 15 minutes per IP.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier of a published course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequestInput"
      responses:
        "201":
          description: Request received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentRequestConfirmation"
        "400":
          description: Invalid data. The errors array lists every problem (e.g. "phone must have exactly 8 digits.").
        "404":
          description: The course does not exist or is not published.
        "409":
          description: An active request for this course already exists for this ID number.
        "429":
          description: Too many requests from this IP. See the Retry-After header.
        "500":
          description: Internal server error.

  /admin/enrollment-requests:
    get:
      tags:
        - Enrollment requests
      summary: List enrollment requests
      description: Newest first. Contains personal data, so it requires an administrator.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: courseId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, contacted, discarded, confirmed]
      responses:
        "200":
          description: List of requests (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentRequest"
        "400":
          description: Invalid filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.

  /admin/enrollment-requests/{id}:
    get:
      tags:
        - Enrollment requests
      summary: Get one enrollment request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentRequest"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment request not found.

  /admin/enrollment-requests/{id}/status:
    patch:
      tags:
        - Enrollment requests
      summary: Change the follow-up status of a request
      description: Any change between pending, contacted and discarded is allowed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, contacted, discarded]
      responses:
        "200":
          description: Updated request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentRequest"
        "400":
          description: Invalid status.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment request not found.

  /admin/courses/{courseId}/enrollments:
    get:
      tags:
        - Enrollments
      summary: List the students of a course
      description: Active enrollments first, then cancelled ones. Contains personal data.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [enrolled, cancelled]
      responses:
        "200":
          description: Enrollments of the course (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid status filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
    post:
      tags:
        - Enrollments
      summary: Register a student manually
      description: >-
        Registers a confirmed enrollment after the payment was coordinated. Same data rules as an enrollment
        request (national ID 9 digits starting 1-7, DIMEX 11-12 digits, phone 8 digits; dashes and spaces are
        removed) plus an optional note. Rejects duplicates and enrollments beyond the capacity. If the person had a
        pending or contacted request for the course, it is marked as confirmed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Enrollment registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid data; the errors array lists every problem.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: >-
            Conflict. The code field says why: COURSE_FULL (no spots left), ALREADY_ENROLLED (the ID number is
            already actively enrolled in this course), COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED or REQUEST_DISCARDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentConflict"

  /admin/enrollment-requests/{id}/confirm:
    post:
      tags:
        - Enrollments
      summary: Confirm an enrollment request
      description: >-
        Creates the enrollment from a pending or contacted request with its data and marks the request as
        confirmed, so it is not processed twice. Any person field sent in the body replaces the request's value
        (to correct it); note is optional.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  example: Pagó por SINPE
                fullName:
                  type: string
                idType:
                  type: string
                  enum: [national, dimex]
                idNumber:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Enrollment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid data.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment request or course not found.
        "409":
          description: >-
            Conflict. The code field says why: COURSE_FULL (no spots left), ALREADY_ENROLLED (the ID number is
            already actively enrolled in this course), COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED or REQUEST_DISCARDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentConflict"

  /admin/enrollments/{id}:
    patch:
      tags:
        - Enrollments
      summary: Correct or cancel an enrollment
      description: >-
        Partial update. Cancelling (status cancelled) frees a spot. Setting status enrolled again needs a free spot
        and no other active enrollment of the same ID number in the course.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                idType:
                  type: string
                  enum: [national, dimex]
                idNumber:
                  type: string
                phone:
                  type: string
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                status:
                  type: string
                  enum: [enrolled, cancelled]
      responses:
        "200":
          description: Updated enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid data or empty body.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment not found.
        "409":
          description: >-
            Conflict. The code field says why: COURSE_FULL (no spots left), ALREADY_ENROLLED (the ID number is
            already actively enrolled in this course), COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED or REQUEST_DISCARDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentConflict"

components:
  securitySchemes:
    studentAccessBearer:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256 student access token
      description: Temporary 900-second student token from POST /student-access/verify; not Firebase authentication.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StudentAccessFileError:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    UpdateCourseStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - published
            - archived
    CreateCourseRequest:
      type: object
      required:
        - name
        - summary
        - description
      allOf:
        - $ref: "#/components/schemas/CourseFields"
      properties:
        schedule:
          $ref: "#/components/schemas/CourseScheduleInput"
    CourseSchedule:
      type: object
      nullable: true
      description: Normalized response. Legacy times, frequency and weekday default to null. Legacy description
        becomes scheduleNote when scheduleNote is absent. Reads never migrate stored data.
      properties:
        startDate:
          type: string
          format: date
          example: 2026-11-03
        endDate:
          type: string
          format: date
          nullable: true
          description: Must not precede startDate. Required for weekly courses.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
          nullable: true
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than startTime.
          example: 21:00
          nullable: true
        frequency:
          type: string
          enum:
            - single
            - weekly
            - null
          nullable: true
        weekday:
          type: string
          nullable: true
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
          description: Required for weekly. Normally null for single.
        scheduleNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional trimmed text; empty becomes null.
    Course:
      allOf:
        - $ref: "#/components/schemas/CourseFields"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - draft
                - published
                - archived
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            schedule:
              $ref: "#/components/schemas/CourseSchedule"
    CourseScheduleInput:
      type: object
      nullable: true
      description: Null is valid, including for published courses. An object requires real dates and clock times.
        Weekly additionally requires endDate and weekday; no duration limit.
      required:
        - startDate
        - startTime
        - endTime
        - frequency
      properties:
        startDate:
          type: string
          format: date
          example: 2026-11-03
        endDate:
          type: string
          format: date
          nullable: true
          description: Must not precede startDate. Required for weekly courses.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than startTime.
          example: 21:00
        frequency:
          type: string
          enum:
            - single
            - weekly
        weekday:
          type: string
          nullable: true
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
          description: Required for weekly. Normally null for single.
        scheduleNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional trimmed text; empty becomes null.
    CourseFields:
      type: object
      description: Optional text is trimmed; blank text becomes null. Omitted optional values become null (arrays
        become empty arrays).
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        summary:
          type: string
          minLength: 10
          maxLength: 240
        description:
          type: string
          minLength: 20
          maxLength: 5000
        imageUrl:
          type: string
          format: uri
          nullable: true
        learningOutcomes:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 15
        requiredMaterials:
          type: array
          items:
            type: string
            maxLength: 150
          maxItems: 30
        capacity:
          type: integer
          minimum: 1
          nullable: true
          description: Positive integer capacity with no fixed maximum. Optional, including for publication.
        price:
          type: integer
          minimum: 0
          nullable: true
          description: Non-negative integer CRC amount with no fixed maximum. Required for publication; 0 means free.
        instructor:
          type: string
          minLength: 3
          maxLength: 120
          nullable: true
          description: Optional free-text instructor name; not required for publication.
        courseType:
          type: string
          nullable: true
          enum:
            - basic
            - workshop
            - demonstrative
            - semi_demonstrative
            - multi_week
            - other
            - null
          description: "Stable API values: basic (básico), workshop (taller), demonstrative (demostrativo),
            semi_demonstrative (semidemostrativo), multi_week (varias semanas), other (otro). Null allowed for
            incomplete or legacy courses."
        whatYouWillLearn:
          type: string
          nullable: true
          maxLength: 5000
          description: Free text; complements learningOutcomes. No automatic migration.
        location:
          type: string
          nullable: true
          maxLength: 240
        address:
          type: string
          nullable: true
          maxLength: 1000
        materialsNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Complements requiredMaterials.
        prerequisites:
          type: string
          nullable: true
          maxLength: 5000
        reservationAmount:
          type: integer
          nullable: true
          minimum: 0
          description: Optional integer CRC reservation amount; zero valid; no fixed maximum.
        priceNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional free text; amounts are not parsed.

    RecipeBook:
      type: object
      required:
        - id
        - courseId
        - title
        - fileName
        - contentType
        - sizeBytes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        courseId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          example: Recetario de Masas y Cremas
        fileName:
          type: string
          example: recetario_masas_cremas.pdf
        contentType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          example: 1048576
        createdAt:
          type: string
          format: date-time
          example: "2026-10-16T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-16T12:00:00.000Z"

    PublicCourse:
      type: object
      required:
        - id
        - name
        - summary
        - description
        - imageUrl
        - learningOutcomes
        - requiredMaterials
        - capacity
        - remainingSpots
        - price
        - instructor
        - schedule
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Repostería Básica
        summary:
          type: string
          example: Aprende técnicas básicas para preparar pasteles.
        description:
          type: string
          example: Un curso práctico para principiantes.
        imageUrl:
          type: string
          nullable: true
          example: https://example.com/imagen.jpg
        learningOutcomes:
          type: array
          items:
            type: string
        requiredMaterials:
          type: array
          items:
            type: string
        capacity:
          type: integer
          nullable: true
          example: 8
        remainingSpots:
          type: integer
          nullable: true
          example: 3
          description: Capacity minus confirmed (active) enrollments (HU-A09). Null when the course has no capacity.
        price:
          type: integer
          nullable: true
          example: 35000
        instructor:
          type: string
          nullable: true
          example: Yamilena Blanco Chaves
        schedule:
          $ref: "#/components/schemas/CourseSchedule"

    EnrollmentRequestInput:
      type: object
      required:
        - fullName
        - idType
        - idNumber
        - phone
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 120
          example: María González Pérez
        idType:
          type: string
          enum: [national, dimex]
          description: national = Costa Rican cédula (9 digits, starts with 1-7); dimex = resident ID (11 or 12 digits).
        idNumber:
          type: string
          example: "205380021"
        phone:
          type: string
          description: Exactly 8 digits.
          example: "88888888"

    EnrollmentRequestConfirmation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
        courseName:
          type: string
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
        message:
          type: string

    EnrollmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
        courseName:
          type: string
          description: Copy of the course name when the request was sent.
        fullName:
          type: string
        idType:
          type: string
          enum: [national, dimex]
        idNumber:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [pending, contacted, discarded, confirmed]
          description: confirmed is set only by the confirm endpoint (HU-A09).
        enrollmentId:
          type: string
          nullable: true
          description: Enrollment created when the request was confirmed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnrollmentInput:
      type: object
      required:
        - fullName
        - idType
        - idNumber
        - phone
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 120
        idType:
          type: string
          enum: [national, dimex]
        idNumber:
          type: string
          example: "105380021"
        phone:
          type: string
          example: "88887777"
        note:
          type: string
          nullable: true
          maxLength: 500
          example: Pagó por SINPE

    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
        courseName:
          type: string
        fullName:
          type: string
        idType:
          type: string
          enum: [national, dimex]
        idNumber:
          type: string
          description: Digits only.
        phone:
          type: string
          description: 8 digits.
        enrollmentRequestId:
          type: string
          nullable: true
          description: Original enrollment request, if it came from one.
        note:
          type: string
          nullable: true
        status:
          type: string
          enum: [enrolled, cancelled]
        confirmedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnrollmentConflict:
      type: object
      properties:
        message:
          type: string
          example: The course is full.
        code:
          type: string
          enum: [COURSE_FULL, ALREADY_ENROLLED, COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED, REQUEST_DISCARDED]

    PublicProductCategory:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          type: string
          description: Category unique identifier.
        name:
          type: string
          description: Category display name.

    PublicProduct:
      type: object
      required: [id, name, description, price, imageUrl, available, category]
      properties:
        id:
          type: string
          description: Product unique identifier.
        name:
          type: string
          description: Product display name.
        description:
          type: string
          nullable: true
          description: Product description, or null if not provided.
        price:
          type: integer
          description: Price in Costa Rican colones (CRC).
        imageUrl:
          type: string
          nullable: true
          description: >-
            Public image URL for the product, or null if omitted or invalid. Must use http or
            https protocol with a maximum length of 500 characters. Automatically sanitized.
        available:
          type: boolean
          description: Indicates whether the product is currently in stock.
        category:
          $ref: "#/components/schemas/PublicProductCategory"

