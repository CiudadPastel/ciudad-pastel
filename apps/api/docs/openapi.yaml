openapi: 3.0.3

info:
  title: Ciudad Pastel API
  version: 1.0.0
  description: API for Ciudad Pastel administrative and public operations.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Contact
    description: Public business contact configuration (HU-T05 backend)
  - name: Student access
    description: Public student enrollment verification (CIU-119)
  - name: Courses
    description: Course administration
  - name: Recipe Books
    description: Recipe book PDF administration
  - name: Enrollment requests
    description: Enrollment requests from visitors (HU-A05)
  - name: Enrollments
    description: Confirmed enrollments registered by the administrator (HU-A09)
  - name: Products
    description: Public product catalog operations (HU-T01)
  - name: Admin Products
    description: Product catalog administration operations (HU-T06)

paths:
  /contact/whatsapp:
    get:
      tags: [Contact]
      summary: Retrieve configured WhatsApp contact (CIU-154)
      security: []
      description: >-
        Public endpoint driven by WHATSAPP_CONTACT_PHONE and the optional
        WHATSAPP_CONTACT_MESSAGE_TEMPLATE environment variables, read on each request.
        No Firebase access or authentication. Surrounding whitespace is trimmed from both
        values; internal whitespace is not removed. The phone must contain a leading + and
        1-15 ASCII digits with a nonzero first digit. This validates structure only.
        A missing or blank phone returns 404, even if a template is configured.
        An invalid phone or custom template returns a safe 500 without configuration values.
        Missing or blank templates use the provisional technical fallback
        "Hola, quisiera información sobre {{productName}}."; this is not a client-approved
        business statement. Custom templates must include the exact {{productName}}
        placeholder and contain at most 1000 Unicode code points after trimming.
        The response template is plain text: no HTML interpretation or placeholder substitution.
        The future frontend replaces the placeholder and URL-encodes the message when opening
        WhatsApp; this endpoint does not build a URL or send messages.
        Official phone and business-approved message remain pending under CIU-152.
      responses:
        "200":
          description: Exactly the normalized phone and resolved plain-text message template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppContact"
        "404":
          description: Phone is absent, empty or whitespace-only; no fallback number is supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppContactNotConfigured"
        "500":
          description: Invalid configured phone or template; no raw values or exception details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppContactConfigurationError"

  /products:
    get:
      tags: [Products]
      summary: Retrieve the public product catalog (CIU-132)
      security: []
      description: >-
        Public endpoint; no authentication required. Returns a paginated list of all
        published products sorted by category display order and product name.
        Optionally filters by the stored category relationship before pagination. Unknown
        category IDs (including missing category documents) and categories without published
        products return HTTP 200 with empty items/products, total 0 and hasMore false.
        Published out-of-stock products remain visible. Total and hasMore reflect the filter.
        Omitting both category filters preserves the existing catalog behavior.
        Provisional CIU-141 rules are pending confirmation with Ciudad Pastel.
        Repeated categoryIds select the OR union without duplicates; filtering precedes pagination.
        The complete snapshot is shared with /categories and cached in memory for 60 seconds; explicit invalidation
        refreshes both endpoints on the next request.
        Examples use the /api base path: /api/products, /api/products?categoryId=category-1,
        /api/products?categoryId=category-1&page=2&limit=12,
        /api/products?categoryIds=category-1&categoryIds=category-2.
      parameters:
        - name: categoryId
          in: query
          required: false
          description: >-
            Exact stored category identifier; not a display name. No trimming or case folding.
            Mutually exclusive with categoryIds. Omitted with no categoryIds means no filter.
            Unknown IDs return an empty catalog. Empty, whitespace-only
            or non-string/repeated values (including bracket object/array notation) return
            HTTP 400, never the unfiltered catalog.
          schema:
            type: string
            minLength: 1
          example: category-1
        - name: categoryIds
          in: query
          required: false
          style: form
          explode: true
          description: >-
            Repeat this exact parameter for an OR union of stored category IDs, before pagination.
            One entry is supported. IDs are compared exactly, without trimming or case folding.
            Duplicate IDs are ignored; unknown IDs are ignored and all-unknown selection returns
            HTTP 200 with an empty filtered catalog. Maximum 20 entries before deduplication.
            Empty or whitespace-only entries, bracket/object/nested notation, more than 20 entries,
            or simultaneous categoryId and categoryIds return HTTP 400 without loading the catalog.
            Commas are literal ID characters, never a list separator.
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              minLength: 1
          example: [category-1, category-2]
        - name: q
          in: query
          required: false
          description: >-
            Optional text search (HU-T03) over product name and brand, and also description
            (ranked lower). Ignores uppercase/lowercase, accents and punctuation ("jabon" finds
            "Jabón") and matches partial words ("choco" finds "Chocolate oscuro"). With several
            words, every word must appear, in any order. Searches shorter than 2 characters
            (after removing spaces and punctuation) are ignored and return the normal catalog.
            Can be combined with categoryId or categoryIds and with pagination; total and
            hasMore refer to the matching products. Hidden (withdrawn) products never appear.
            Results are ordered by relevance (name starting with the search, then name, then
            brand, then description), keeping catalog order for ties. Repeated or bracket
            notation returns 400 "q must be a single text value."; more than 100 characters
            returns 400 "q must not exceed 100 characters.".
          schema:
            type: string
            maxLength: 100
          example: fondant
        - name: page
          in: query
          required: false
          description: Page number (1-indexed). Defaults to 1.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page. Defaults to 12, maximum 50.
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Paginated response with published products in the catalog and hasMore.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProductListResponse"
        "400":
          description: >-
            Invalid filters; validation never falls back to the unfiltered catalog.
            Messages (in validation precedence order): "categoryId must be a non-empty string.";
            "categoryIds must use repeated non-empty string parameters; bracket notation is not supported.";
            "categoryId and categoryIds cannot be used together.";
            "categoryIds must contain at most 20 entries.";
            "categoryIds must contain only non-empty strings."
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: categoryId must be a non-empty string.
        "500":
          description: Safe internal failure when loading the catalog.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Could not load the product catalog.

  /products/{id}:
    get:
      tags: [Products]
      summary: Get the public detail of one product (HU-T02)
      security: []
      description: >-
        No authentication required. Returns the full public information of one published
        product: name, brand, description, weight, size, price, image, category and stock
        availability (available = inStock). Returns 404 with the same message when the product
        does not exist or is hidden (status other than published), so hidden products cannot
        be opened even with their direct link. IDs with characters other than letters, digits,
        "-" or "_" (or longer than 128) are answered with 404 without querying Firestore.
        Reads Firestore directly (not the 60-second catalog cache), so a withdrawn product
        stops being visible immediately. Internal fields (status, categoryId, createdAt,
        updatedAt) are never exposed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
          example: seed-prod-05
      responses:
        "200":
          description: Public product detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProductDetail"
        "404":
          description: Product does not exist or is hidden.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Product not found.
        "500":
          description: Safe internal failure when loading the product.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Could not load the product.

  /categories:
    get:
      tags: [Products]
      summary: List public product categories (CIU-143)
      security: []
      description: >-
        No authentication required. Includes only existing categories referenced by at least
        one published product, including out-of-stock products. Empty categories, categories
        with only withdrawn products and missing category references are excluded.
        Ordered by configured display order ascending, then name using Spanish locale.
        Exactly id, name, productCount and imageUrl are exposed; no administrative metadata.
        productCount counts published products regardless of availability, before pagination.
        imageUrl is the first non-null sanitized public product image in deterministic catalog
        order within that category, or null. No additional Firestore queries or stored fields.
        These CIU-141 rules are provisional and pending confirmation with Ciudad Pastel.
        Shares the complete 60-second snapshot and explicit invalidation with /products.
      responses:
        "200":
          description: Ordered categories, or an empty array when none qualify.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCategory"
              example:
                - id: category-1
                  name: Chocolates
                  productCount: 12
                  imageUrl: https://example.com/chocolate.jpg
                - id: category-2
                  name: Decoración
                  productCount: 2
                  imageUrl: null
        "500":
          description: Safe internal failure; exception details are never exposed or cached.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Could not load the product categories.

  /student-access/verify:
    post:
      tags: [Student access]
      summary: Verify student enrollment and issue temporary access
      security: []
      description: >-
        Public endpoint; no Firebase account or administrative authentication.
        Name is collected but is not used for exact matching. Normalized ID and
        phone must match the same active confirmed enrollment; cancelled
        enrollments are excluded. Spaces, hyphens and other non-digit characters
        are removed using existing enrollment normalization. National IDs have
        9 digits starting with 1-7; DIMEX has 11 or 12 digits; phone has 8 digits.
        The signed token expires after 900 seconds and is not a permanent account.
        Only courses with recipe books appear; each course may currently have
        multiple recipe books. Valid identity with no books returns courses [].
        Material access re-checks active enrollment even with a valid token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, idNumber, phone]
              properties:
                fullName:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Trimmed with collapsed whitespace; not an authentication factor.
                idNumber:
                  type: string
                  example: 1-0538-0021
                phone:
                  type: string
                  example: 8888 7777
      responses:
        "200":
          description: Successful verification, including when courses is empty.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, courses]
                properties:
                  accessToken:
                    type: string
                    description: Temporary signed token; contains no name, phone or ID number.
                  expiresIn:
                    type: integer
                    enum: [900]
                  courses:
                    type: array
                    items:
                      type: object
                      required: [id, name, recipeBooks]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        recipeBooks:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required: [id, title, fileName, sizeBytes]
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              fileName:
                                type: string
                              sizeBytes:
                                type: integer
        "400":
          description: Invalid input, malformed JSON or body over 100 KB; errors do not disclose enrollment existence.
          content:
            application/json:
              schema:
                type: object
                required: [message, errors]
                properties:
                  message:
                    type: string
                    example: Student verification validation failed.
                  errors:
                    type: array
                    items:
                      type: string
        "401":
          description: No matching active enrollment; the same response for every identity mismatch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: ["We couldn't find an enrollment with this data."]
        "429":
          description: More than 5 attempts per IP in 15 minutes; dedicated verification counter.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: [Too many verification attempts. Please try again later.]
        "500":
          description: Safe internal failure, including missing token secret configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum: [Could not verify student access.]

  /student-access/courses/{courseId}/recipe-books/{recipeBookId}/file:
    get:
      tags: [Student access]
      summary: View an authorized course recipe-book PDF (CIU-121)
      description: >-
        Requires the temporary student token issued by POST /student-access/verify,
        not Firebase/admin authentication. The requested course must be in the
        token courseIds, and at least one enrollment identified by its enrollmentIds
        must currently exist, be enrolled, and belong to that course. Token validity
        alone is insufficient. Cancellation revokes practical access on subsequent
        requests immediately without waiting for token expiry, unless another
        represented active enrollment grants access. Returns the specifically
        requested PDF using existing HU-A03 ownership and storage checks.
        This route refines the original singular CIU-121 wording because HU-A03
        supports multiple recipe books per course; recipeBookId comes from
        courses[].recipeBooks[]. No recipe book is arbitrarily selected.
      security:
        - studentAccessBearer: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized PDF bytes, viewed inline; no enrollment or storage metadata.
          headers:
            Content-Disposition:
              description: Inline disposition with safely quoted/encoded stored filename.
              schema:
                type: string
                example: 'inline; filename="macarons.pdf"'
            Content-Length:
              description: Actual PDF Buffer length in bytes.
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                enum: ["private, no-store"]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Missing Authorization, wrong scheme, missing/malformed token, invalid signature or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Invalid or expired student access token.
        "403":
          description: Course absent from token claims or no represented enrollment remains active for it, including cancellation/deletion/reassignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Student access is not authorized for this course.
        "404":
          description: Course/book missing, book belongs to another course, or binary missing; same safe response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Recipe book not found.
        "500":
          description: Missing/invalid server token configuration or unexpected repository/storage failure; no internal details disclosed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessFileError"
              example:
                message: Could not retrieve recipe book.

  /admin/courses:
    get:
      tags:
        - Courses
      summary: List administrative courses
      description: Returns all courses, including draft, published, and archived courses, optionally filtered by status.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter courses by status. Omit to return all courses.
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
      responses:
        "200":
          description: Courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          description: Unsupported status filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "500":
          description: Internal server error.

    post:
      tags:
        - Courses
      summary: Create a course
      description: Creates a new course. New courses are always created as draft.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"

            example:
              name: Pastelería Básica
              summary: Aprende los fundamentos de la pastelería.
              description: En este curso aprenderás técnicas fundamentales de preparación y decoración.
              imageUrl: null
              learningOutcomes:
                - Preparar masas básicas
                - Aplicar técnicas básicas de decoración
              requiredMaterials:
                - Delantal
                - Espátula

      responses:
        "201":
          description: Course created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

        "400":
          description: Invalid course data.

        "401":
          description: Authentication required or invalid token.

        "403":
          description: Administrator privileges required.

        "500":
          description: Internal server error.

  /admin/courses/{id}:
    get:
      tags:
        - Courses
      summary: Get an administrative course
      description: Returns a course using its Firestore document ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      responses:
        "200":
          description: Course retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

    put:
      tags:
        - Courses
      summary: Update an administrative course
      description: >-
        Replaces the editable base course information using the creation validation rules.
        Name, summary, and description are required. Omitted imageUrl defaults to null,
        and omitted learningOutcomes and requiredMaterials default to empty arrays.
        Omitted optional scalars and schedule are cleared to null. Only clearing price on a published course
        is rejected with 400; capacity, schedule and instructor may be cleared.
        Client-supplied id, status, createdAt, and updatedAt are ignored.
        The existing ID, status, and createdAt are preserved; updatedAt is generated by the server.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "200":
          description: Course updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course data.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{id}/status:
    patch:
      tags:
        - Courses
      summary: Change an administrative course status
      description: >-
        Allows draft to published, published to draft, and draft or published to archived.
        Archived to draft restores (unarchives) the course as a draft, hidden from the public listing until explicitly published.
        Archived to published and same-state transitions are rejected.
        Publishing requires only a valid non-negative integer price in CRC; zero means free. All other optional fields may be null.
        Only status and the server-generated updatedAt change; course content, ID, and createdAt are preserved.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseStatusRequest"
      responses:
        "200":
          description: Course status changed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid status input or request body, or missing/invalid publication price. Missing price is reported in the errors array as price is required for a published course.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Status transition is not allowed.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books:
    post:
      tags:
        - Recipe Books
      summary: Upload and link a recipe book PDF
      description: Uploads a PDF recipe book and links it to an existing course.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course to link the recipe book to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file of the recipe book (max 20 MiB).
                title:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Optional descriptive title. Defaults to the base file name.
      responses:
        "201":
          description: Recipe book created and linked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeBook"
        "400":
          description: Validation failed (missing file, non-PDF, invalid signature, empty file, or invalid title).
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Course already has reached the maximum of 10 recipe books.
        "413":
          description: File size exceeds the maximum allowed limit.
        "500":
          description: Internal server error.

    get:
      tags:
        - Recipe Books
      summary: List recipe books for a course
      description: Returns all recipe books linked to the specified course, sorted newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
      responses:
        "200":
          description: Recipe books retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeBook"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books/{recipeBookId}/file:
    get:
      tags:
        - Recipe Books
      summary: Download recipe book PDF
      description: Streams the PDF file of the specified recipe book as an attachment.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          description: ID of the recipe book.
          schema:
            type: string
      responses:
        "200":
          description: Recipe book PDF file downloaded successfully.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course or recipe book not found.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books/{recipeBookId}:
    delete:
      tags:
        - Recipe Books
      summary: Delete a recipe book
      description: Permanently deletes a recipe book record and its stored binary file chunks.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          description: ID of the recipe book.
          schema:
            type: string
      responses:
        "204":
          description: Recipe book deleted successfully.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course or recipe book not found.
        "500":
          description: Internal server error.


  /courses:
    get:
      tags:
        - Courses
      summary: List published courses
      description: Returns only published courses sorted by start date ascending. Authentication is not required; draft and archived courses are excluded.
      security: []
      responses:
        "200":
          description: Published courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCourse"
        "500":
          description: Internal server error.

  /courses/{id}:
    get:
      tags:
        - Courses
      summary: Get published course details
      description: Returns public course details by identifier. Only published courses are returned; drafts, archived, or nonexistent courses return 404.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Unique identifier of the course.
      responses:
        "200":
          description: Public course details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCourse"
        "404":
          description: Course not found or not published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Course not found.
        "500":
          description: Internal server error.

  /courses/{id}/enrollment-requests:
    post:
      tags:
        - Enrollment requests
      summary: Submit an enrollment request (public)
      description: >-
        HU-A05. A visitor without an account asks to enroll in a published course. The request is saved as
        pending and linked to the course; it never creates a confirmed enrollment (payment is coordinated
        outside the platform). Only fullName, idType, idNumber and phone are accepted; other fields are ignored.
        Spaces and hyphens in idNumber and phone are removed. A national ID has 9 digits and starts with 1-7;
        a DIMEX has 11 or 12 digits; the phone has exactly 8 digits. One active (pending or contacted) request
        per ID number and course; a discarded request does not block a new one.
        Limited to 5 requests every 15 minutes per IP.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identifier of a published course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequestInput"
      responses:
        "201":
          description: Request received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentRequestConfirmation"
        "400":
          description: Invalid data. The errors array lists every problem (e.g. "phone must have exactly 8 digits.").
        "404":
          description: The course does not exist or is not published.
        "409":
          description: An active request for this course already exists for this ID number.
        "429":
          description: Too many requests from this IP. See the Retry-After header.
        "500":
          description: Internal server error.

  /admin/enrollment-requests:
    get:
      tags:
        - Enrollment requests
      summary: List enrollment requests
      description: Newest first. Contains personal data, so it requires an administrator.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: courseId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, contacted, discarded, confirmed]
      responses:
        "200":
          description: List of requests (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentRequest"
        "400":
          description: Invalid filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.

  /admin/enrollment-requests/{id}:
    get:
      tags:
        - Enrollment requests
      summary: Get one enrollment request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentRequest"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment request not found.

  /admin/enrollment-requests/{id}/status:
    patch:
      tags:
        - Enrollment requests
      summary: Change the follow-up status of a request
      description: Any change between pending, contacted and discarded is allowed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, contacted, discarded]
      responses:
        "200":
          description: Updated request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentRequest"
        "400":
          description: Invalid status.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment request not found.

  /admin/courses/{courseId}/enrollments:
    get:
      tags:
        - Enrollments
      summary: List the students of a course
      description: Active enrollments first, then cancelled ones. Contains personal data.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [enrolled, cancelled]
      responses:
        "200":
          description: Enrollments of the course (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid status filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
    post:
      tags:
        - Enrollments
      summary: Register a student manually
      description: >-
        Registers a confirmed enrollment after the payment was coordinated. Same data rules as an enrollment
        request (national ID 9 digits starting 1-7, DIMEX 11-12 digits, phone 8 digits; dashes and spaces are
        removed) plus an optional note. Rejects duplicates and enrollments beyond the capacity. If the person had a
        pending or contacted request for the course, it is marked as confirmed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Enrollment registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid data; the errors array lists every problem.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: >-
            Conflict. The code field says why: COURSE_FULL (no spots left), ALREADY_ENROLLED (the ID number is
            already actively enrolled in this course), COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED or REQUEST_DISCARDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentConflict"

  /admin/enrollment-requests/{id}/confirm:
    post:
      tags:
        - Enrollments
      summary: Confirm an enrollment request
      description: >-
        Creates the enrollment from a pending or contacted request with its data and marks the request as
        confirmed, so it is not processed twice. Any person field sent in the body replaces the request's value
        (to correct it); note is optional.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  example: Pagó por SINPE
                fullName:
                  type: string
                idType:
                  type: string
                  enum: [national, dimex]
                idNumber:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Enrollment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid data.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment request or course not found.
        "409":
          description: >-
            Conflict. The code field says why: COURSE_FULL (no spots left), ALREADY_ENROLLED (the ID number is
            already actively enrolled in this course), COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED or REQUEST_DISCARDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentConflict"

  /admin/enrollments/{id}:
    patch:
      tags:
        - Enrollments
      summary: Correct or cancel an enrollment
      description: >-
        Partial update. Cancelling (status cancelled) frees a spot. Setting status enrolled again needs a free spot
        and no other active enrollment of the same ID number in the course.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                idType:
                  type: string
                  enum: [national, dimex]
                idNumber:
                  type: string
                phone:
                  type: string
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                status:
                  type: string
                  enum: [enrolled, cancelled]
      responses:
        "200":
          description: Updated enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: Invalid data or empty body.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Enrollment not found.
        "409":
          description: >-
            Conflict. The code field says why: COURSE_FULL (no spots left), ALREADY_ENROLLED (the ID number is
            already actively enrolled in this course), COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED or REQUEST_DISCARDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentConflict"


  /admin/categories:
    get:
      tags:
        - Admin Products
      summary: List categories for administration
      description: Returns all categories sorted by order and Spanish name for administrative form selection. Requires administrative privileges.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Categories retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "500":
          description: Internal server error.

  /admin/products:
    get:
      tags:
        - Admin Products
      summary: List administrative products
      description: Returns all products regardless of lifecycle status (published or withdrawn), ordered by last update descending. Requires administrative privileges.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Products retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "500":
          description: Internal server error.

  /admin/products/{id}:
    get:
      tags:
        - Admin Products
      summary: Get administrative product by identifier
      description: Returns one product by identifier regardless of lifecycle status. Requires administrative privileges.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the product to retrieve.
          schema:
            type: string
      responses:
        "200":
          description: Product retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Product not found.
        "500":
          description: Internal server error.

components:
  securitySchemes:
    studentAccessBearer:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256 student access token
      description: Temporary 900-second student token from POST /student-access/verify; not Firebase authentication.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WhatsAppContact:
      type: object
      additionalProperties: false
      required: [phone, messageTemplate]
      properties:
        phone:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^\+[1-9][0-9]{0,14}$'
          description: Full international phone including +, with surrounding whitespace trimmed.
        messageTemplate:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '\{\{productName\}\}'
          description: >-
            Plain text with the exact {{productName}} placeholder preserved; surrounding
            whitespace is trimmed. Length is measured in Unicode code points.
          example: "Hola, quisiera información sobre {{productName}}."
    WhatsAppContactNotConfigured:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          enum: ["WhatsApp contact is not configured."]
    WhatsAppContactConfigurationError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          enum: ["WhatsApp contact configuration is invalid."]
    StudentAccessFileError:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    UpdateCourseStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - published
            - archived
    CreateCourseRequest:
      type: object
      required:
        - name
        - summary
        - description
      allOf:
        - $ref: "#/components/schemas/CourseFields"
      properties:
        schedule:
          $ref: "#/components/schemas/CourseScheduleInput"
    CourseSchedule:
      type: object
      nullable: true
      description: Normalized response. Legacy times, frequency and weekday default to null. Legacy description
        becomes scheduleNote when scheduleNote is absent. Reads never migrate stored data.
      properties:
        startDate:
          type: string
          format: date
          example: 2026-11-03
        endDate:
          type: string
          format: date
          nullable: true
          description: Must not precede startDate. Required for weekly courses.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
          nullable: true
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than startTime.
          example: 21:00
          nullable: true
        frequency:
          type: string
          enum:
            - single
            - weekly
            - null
          nullable: true
        weekday:
          type: string
          nullable: true
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
          description: Required for weekly. Normally null for single.
        scheduleNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional trimmed text; empty becomes null.
    Course:
      allOf:
        - $ref: "#/components/schemas/CourseFields"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - draft
                - published
                - archived
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            schedule:
              $ref: "#/components/schemas/CourseSchedule"
    CourseScheduleInput:
      type: object
      nullable: true
      description: Null is valid, including for published courses. An object requires real dates and clock times.
        Weekly additionally requires endDate and weekday; no duration limit.
      required:
        - startDate
        - startTime
        - endTime
        - frequency
      properties:
        startDate:
          type: string
          format: date
          example: 2026-11-03
        endDate:
          type: string
          format: date
          nullable: true
          description: Must not precede startDate. Required for weekly courses.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than startTime.
          example: 21:00
        frequency:
          type: string
          enum:
            - single
            - weekly
        weekday:
          type: string
          nullable: true
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
          description: Required for weekly. Normally null for single.
        scheduleNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional trimmed text; empty becomes null.
    CourseFields:
      type: object
      description: Optional text is trimmed; blank text becomes null. Omitted optional values become null (arrays
        become empty arrays).
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        summary:
          type: string
          minLength: 10
          maxLength: 240
        description:
          type: string
          minLength: 20
          maxLength: 5000
        imageUrl:
          type: string
          format: uri
          nullable: true
        learningOutcomes:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 15
        requiredMaterials:
          type: array
          items:
            type: string
            maxLength: 150
          maxItems: 30
        capacity:
          type: integer
          minimum: 1
          nullable: true
          description: Positive integer capacity with no fixed maximum. Optional, including for publication.
        price:
          type: integer
          minimum: 0
          nullable: true
          description: Non-negative integer CRC amount with no fixed maximum. Required for publication; 0 means free.
        instructor:
          type: string
          minLength: 3
          maxLength: 120
          nullable: true
          description: Optional free-text instructor name; not required for publication.
        courseType:
          type: string
          nullable: true
          enum:
            - basic
            - workshop
            - demonstrative
            - semi_demonstrative
            - multi_week
            - other
            - null
          description: "Stable API values: basic (básico), workshop (taller), demonstrative (demostrativo),
            semi_demonstrative (semidemostrativo), multi_week (varias semanas), other (otro). Null allowed for
            incomplete or legacy courses."
        whatYouWillLearn:
          type: string
          nullable: true
          maxLength: 5000
          description: Free text; complements learningOutcomes. No automatic migration.
        location:
          type: string
          nullable: true
          maxLength: 240
        address:
          type: string
          nullable: true
          maxLength: 1000
        materialsNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Complements requiredMaterials.
        prerequisites:
          type: string
          nullable: true
          maxLength: 5000
        reservationAmount:
          type: integer
          nullable: true
          minimum: 0
          description: Optional integer CRC reservation amount; zero valid; no fixed maximum.
        priceNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional free text; amounts are not parsed.

    RecipeBook:
      type: object
      required:
        - id
        - courseId
        - title
        - fileName
        - contentType
        - sizeBytes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        courseId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          example: Recetario de Masas y Cremas
        fileName:
          type: string
          example: recetario_masas_cremas.pdf
        contentType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          example: 1048576
        createdAt:
          type: string
          format: date-time
          example: "2026-10-16T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-16T12:00:00.000Z"

    PublicCourse:
      type: object
      required:
        - id
        - name
        - summary
        - description
        - imageUrl
        - learningOutcomes
        - requiredMaterials
        - capacity
        - remainingSpots
        - price
        - instructor
        - schedule
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Repostería Básica
        summary:
          type: string
          example: Aprende técnicas básicas para preparar pasteles.
        description:
          type: string
          example: Un curso práctico para principiantes.
        imageUrl:
          type: string
          nullable: true
          example: https://example.com/imagen.jpg
        learningOutcomes:
          type: array
          items:
            type: string
        requiredMaterials:
          type: array
          items:
            type: string
        capacity:
          type: integer
          nullable: true
          example: 8
        remainingSpots:
          type: integer
          nullable: true
          example: 3
          description: Capacity minus confirmed (active) enrollments (HU-A09). Null when the course has no capacity.
        price:
          type: integer
          nullable: true
          example: 35000
        instructor:
          type: string
          nullable: true
          example: Yamilena Blanco Chaves
        schedule:
          $ref: "#/components/schemas/CourseSchedule"

    EnrollmentRequestInput:
      type: object
      required:
        - fullName
        - idType
        - idNumber
        - phone
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 120
          example: María González Pérez
        idType:
          type: string
          enum: [national, dimex]
          description: national = Costa Rican cédula (9 digits, starts with 1-7); dimex = resident ID (11 or 12 digits).
        idNumber:
          type: string
          example: "205380021"
        phone:
          type: string
          description: Exactly 8 digits.
          example: "88888888"

    EnrollmentRequestConfirmation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
        courseName:
          type: string
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
        message:
          type: string

    EnrollmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
        courseName:
          type: string
          description: Copy of the course name when the request was sent.
        fullName:
          type: string
        idType:
          type: string
          enum: [national, dimex]
        idNumber:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [pending, contacted, discarded, confirmed]
          description: confirmed is set only by the confirm endpoint (HU-A09).
        enrollmentId:
          type: string
          nullable: true
          description: Enrollment created when the request was confirmed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnrollmentInput:
      type: object
      required:
        - fullName
        - idType
        - idNumber
        - phone
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 120
        idType:
          type: string
          enum: [national, dimex]
        idNumber:
          type: string
          example: "105380021"
        phone:
          type: string
          example: "88887777"
        note:
          type: string
          nullable: true
          maxLength: 500
          example: Pagó por SINPE

    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
        courseName:
          type: string
        fullName:
          type: string
        idType:
          type: string
          enum: [national, dimex]
        idNumber:
          type: string
          description: Digits only.
        phone:
          type: string
          description: 8 digits.
        enrollmentRequestId:
          type: string
          nullable: true
          description: Original enrollment request, if it came from one.
        note:
          type: string
          nullable: true
        status:
          type: string
          enum: [enrolled, cancelled]
        confirmedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnrollmentConflict:
      type: object
      properties:
        message:
          type: string
          example: The course is full.
        code:
          type: string
          enum: [COURSE_FULL, ALREADY_ENROLLED, COURSE_ARCHIVED, REQUEST_ALREADY_CONFIRMED, REQUEST_DISCARDED]

    PublicCategory:
      type: object
      additionalProperties: false
      required: [id, name, productCount, imageUrl]
      properties:
        id:
          type: string
        name:
          type: string
        productCount:
          type: integer
          minimum: 0
          description: Published product count in this existing category, including out-of-stock products; before pagination.
        imageUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 500
          description: First sanitized http/https public product image in catalog order within this category, or null if none is valid.

    PublicProductCategory:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          type: string
          description: Category unique identifier.
        name:
          type: string
          description: Category display name.

    PublicProduct:
      type: object
      required: [id, name, description, price, imageUrl, available, category]
      properties:
        id:
          type: string
          description: Product unique identifier.
        name:
          type: string
          description: Product display name.
        description:
          type: string
          nullable: true
          description: Product description, or null if not provided.
        price:
          type: integer
          description: Price in Costa Rican colones (CRC).
        imageUrl:
          type: string
          nullable: true
          description: >-
            Public image URL for the product, or null if omitted or invalid. Must use http or
            https protocol with a maximum length of 500 characters. Automatically sanitized.
        available:
          type: boolean
          description: Indicates whether the product is currently in stock.
        category:
          $ref: "#/components/schemas/PublicProductCategory"

    PublicProductDetail:
      type: object
      description: Full public product information for the detail page (HU-T02).
      required: [id, name, brand, description, weight, size, price, imageUrl, available, category]
      properties:
        id:
          type: string
          description: Product unique identifier.
        name:
          type: string
          description: Product display name.
        brand:
          type: string
          nullable: true
          maxLength: 60
          description: Brand, or null if not registered.
        description:
          type: string
          nullable: true
          description: Product description, or null if not provided.
        weight:
          type: string
          nullable: true
          maxLength: 40
          description: Free-text net weight or volume (e.g. "500 g", "120 ml"), or null.
        size:
          type: string
          nullable: true
          maxLength: 40
          description: Free-text dimensions (e.g. "24 cm de diámetro"), or null.
        price:
          type: integer
          description: Price in Costa Rican colones (CRC).
        imageUrl:
          type: string
          nullable: true
          description: Sanitized http/https image URL, or null (the client shows a placeholder).
        available:
          type: boolean
          description: In stock (the "inStock" field of HU-T02). Out-of-stock products are still public.
        category:
          $ref: "#/components/schemas/PublicProductCategory"

    PublicProductListResponse:
      type: object
      required: [items, products, hasMore, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicProduct"
          description: Paginated slice of published products.
        products:
          type: array
          items:
            $ref: "#/components/schemas/PublicProduct"
          description: Alias to items for client convenience.
        hasMore:
          type: boolean
          description: Indicates whether the optionally filtered collection has subsequent pages.
        total:
          type: integer
          description: Total number of published products after the optional category filter, before pagination.
        page:
          type: integer
          description: Current page number (1-indexed).
        limit:
          type: integer
          description: Number of products requested per page.

    AdminCategory:
      type: object
      description: Category representation for administrative operations and form selection.
      required: [id, name, order]
      properties:
        id:
          type: string
          description: Category unique identifier.
        name:
          type: string
          description: Category display name.
        order:
          type: integer
          description: Display sort order.

    AdminProduct:
      type: object
      description: Product representation for administrative operations.
      required: [id, name, description, price, imageUrl, available, status, category, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Product unique identifier.
        name:
          type: string
          description: Product display name.
        description:
          type: string
          nullable: true
          description: Product description, or null if omitted.
        price:
          type: integer
          description: Price in Costa Rican colones (CRC).
        imageUrl:
          type: string
          nullable: true
          description: Sanitized http/https image URL, or null.
        available:
          type: boolean
          description: Availability status.
        status:
          type: string
          enum: [published, withdrawn]
          description: Lifecycle status of the product.
        category:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
          description: Associated category or null if not found.
        createdAt:
          type: string
          format: date-time
          description: Document creation timestamp in ISO 8601 format.
        updatedAt:
          type: string
          format: date-time
          description: Document last update timestamp in ISO 8601 format.
