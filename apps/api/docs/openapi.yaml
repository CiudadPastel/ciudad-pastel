openapi: 3.0.3

info:
  title: Ciudad Pastel API
  version: 1.0.0
  description: API for Ciudad Pastel administrative and public operations.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Courses
    description: Course administration
  - name: Recipe Books
    description: Recipe book PDF administration

paths:
  /admin/courses:
    get:
      tags:
        - Courses
      summary: List administrative courses
      description: Returns all courses, including draft, published, and archived courses, optionally filtered by status.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter courses by status. Omit to return all courses.
          schema:
            type: string
            enum:
              - draft
              - published
              - archived
      responses:
        "200":
          description: Courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          description: Unsupported status filter.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "500":
          description: Internal server error.

    post:
      tags:
        - Courses
      summary: Create a course
      description: Creates a new course. New courses are always created as draft.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"

            example:
              name: Pastelería Básica
              summary: Aprende los fundamentos de la pastelería.
              description: En este curso aprenderás técnicas fundamentales de preparación y decoración.
              imageUrl: null
              learningOutcomes:
                - Preparar masas básicas
                - Aplicar técnicas básicas de decoración
              requiredMaterials:
                - Delantal
                - Espátula

      responses:
        "201":
          description: Course created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

        "400":
          description: Invalid course data.

        "401":
          description: Authentication required or invalid token.

        "403":
          description: Administrator privileges required.

        "500":
          description: Internal server error.

  /admin/courses/{id}:
    get:
      tags:
        - Courses
      summary: Get an administrative course
      description: Returns a course using its Firestore document ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      responses:
        "200":
          description: Course retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

    put:
      tags:
        - Courses
      summary: Update an administrative course
      description: >-
        Replaces the editable base course information using the creation validation rules.
        Name, summary, and description are required. Omitted imageUrl defaults to null,
        and omitted learningOutcomes and requiredMaterials default to empty arrays.
        Omitted optional scalars and schedule are cleared to null. Only clearing price on a published course
        is rejected with 400; capacity, schedule and instructor may be cleared.
        Client-supplied id, status, createdAt, and updatedAt are ignored.
        The existing ID, status, and createdAt are preserved; updatedAt is generated by the server.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "200":
          description: Course updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid course data.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{id}/status:
    patch:
      tags:
        - Courses
      summary: Change an administrative course status
      description: >-
        Allows draft to published, published to draft, and draft or published to archived.
        Archived to draft restores (unarchives) the course as a draft, hidden from the public listing until explicitly published.
        Archived to published and same-state transitions are rejected.
        Publishing requires only a valid non-negative integer price in CRC; zero means free. All other optional fields may be null.
        Only status and the server-generated updatedAt change; course content, ID, and createdAt are preserved.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Course document ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseStatusRequest"
      responses:
        "200":
          description: Course status changed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Invalid status input or request body, or missing/invalid publication price. Missing price is reported in the errors array as price is required for a published course.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Status transition is not allowed.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books:
    post:
      tags:
        - Recipe Books
      summary: Upload and link a recipe book PDF
      description: Uploads a PDF recipe book and links it to an existing course.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course to link the recipe book to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file of the recipe book (max 20 MiB).
                title:
                  type: string
                  minLength: 3
                  maxLength: 120
                  description: Optional descriptive title. Defaults to the base file name.
      responses:
        "201":
          description: Recipe book created and linked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeBook"
        "400":
          description: Validation failed (missing file, non-PDF, invalid signature, empty file, or invalid title).
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "409":
          description: Course already has reached the maximum of 10 recipe books.
        "413":
          description: File size exceeds the maximum allowed limit.
        "500":
          description: Internal server error.

    get:
      tags:
        - Recipe Books
      summary: List recipe books for a course
      description: Returns all recipe books linked to the specified course, sorted newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
      responses:
        "200":
          description: Recipe books retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeBook"
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course not found.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books/{recipeBookId}/file:
    get:
      tags:
        - Recipe Books
      summary: Download recipe book PDF
      description: Streams the PDF file of the specified recipe book as an attachment.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          description: ID of the recipe book.
          schema:
            type: string
      responses:
        "200":
          description: Recipe book PDF file downloaded successfully.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course or recipe book not found.
        "500":
          description: Internal server error.

  /admin/courses/{courseId}/recipe-books/{recipeBookId}:
    delete:
      tags:
        - Recipe Books
      summary: Delete a recipe book
      description: Permanently deletes a recipe book record and its stored binary file chunks.
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: ID of the course.
          schema:
            type: string
        - name: recipeBookId
          in: path
          required: true
          description: ID of the recipe book.
          schema:
            type: string
      responses:
        "204":
          description: Recipe book deleted successfully.
        "401":
          description: Authentication required or invalid token.
        "403":
          description: Administrator privileges required.
        "404":
          description: Course or recipe book not found.
        "500":
          description: Internal server error.


  /courses:
    get:
      tags:
        - Courses
      summary: List published courses
      description: Returns only published courses sorted by start date ascending. Authentication is not required; draft and archived courses are excluded.
      security: []
      responses:
        "200":
          description: Published courses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCourse"
        "500":
          description: Internal server error.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UpdateCourseStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - published
            - archived
    CreateCourseRequest:
      type: object
      required:
        - name
        - summary
        - description
      allOf:
        - $ref: "#/components/schemas/CourseFields"
      properties:
        schedule:
          $ref: "#/components/schemas/CourseScheduleInput"
    CourseSchedule:
      type: object
      nullable: true
      description: Normalized response. Legacy times, frequency and weekday default to null. Legacy description
        becomes scheduleNote when scheduleNote is absent. Reads never migrate stored data.
      properties:
        startDate:
          type: string
          format: date
          example: 2026-11-03
        endDate:
          type: string
          format: date
          nullable: true
          description: Must not precede startDate. Required for weekly courses.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
          nullable: true
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than startTime.
          example: 21:00
          nullable: true
        frequency:
          type: string
          enum:
            - single
            - weekly
            - null
          nullable: true
        weekday:
          type: string
          nullable: true
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
          description: Required for weekly. Normally null for single.
        scheduleNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional trimmed text; empty becomes null.
    Course:
      allOf:
        - $ref: "#/components/schemas/CourseFields"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - draft
                - published
                - archived
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            schedule:
              $ref: "#/components/schemas/CourseSchedule"
    CourseScheduleInput:
      type: object
      nullable: true
      description: Null is valid, including for published courses. An object requires real dates and clock times.
        Weekly additionally requires endDate and weekday; no duration limit.
      required:
        - startDate
        - startTime
        - endTime
        - frequency
      properties:
        startDate:
          type: string
          format: date
          example: 2026-11-03
        endDate:
          type: string
          format: date
          nullable: true
          description: Must not precede startDate. Required for weekly courses.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 18:00
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Must be later than startTime.
          example: 21:00
        frequency:
          type: string
          enum:
            - single
            - weekly
        weekday:
          type: string
          nullable: true
          enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - null
          description: Required for weekly. Normally null for single.
        scheduleNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional trimmed text; empty becomes null.
    CourseFields:
      type: object
      description: Optional text is trimmed; blank text becomes null. Omitted optional values become null (arrays
        become empty arrays).
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        summary:
          type: string
          minLength: 10
          maxLength: 240
        description:
          type: string
          minLength: 20
          maxLength: 5000
        imageUrl:
          type: string
          format: uri
          nullable: true
        learningOutcomes:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 15
        requiredMaterials:
          type: array
          items:
            type: string
            maxLength: 150
          maxItems: 30
        capacity:
          type: integer
          minimum: 1
          nullable: true
          description: Positive integer capacity with no fixed maximum. Optional, including for publication.
        price:
          type: integer
          minimum: 0
          nullable: true
          description: Non-negative integer CRC amount with no fixed maximum. Required for publication; 0 means free.
        instructor:
          type: string
          minLength: 3
          maxLength: 120
          nullable: true
          description: Optional free-text instructor name; not required for publication.
        courseType:
          type: string
          nullable: true
          enum:
            - basic
            - workshop
            - demonstrative
            - semi_demonstrative
            - multi_week
            - other
            - null
          description: "Stable API values: basic (básico), workshop (taller), demonstrative (demostrativo),
            semi_demonstrative (semidemostrativo), multi_week (varias semanas), other (otro). Null allowed for
            incomplete or legacy courses."
        whatYouWillLearn:
          type: string
          nullable: true
          maxLength: 5000
          description: Free text; complements learningOutcomes. No automatic migration.
        location:
          type: string
          nullable: true
          maxLength: 240
        address:
          type: string
          nullable: true
          maxLength: 1000
        materialsNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Complements requiredMaterials.
        prerequisites:
          type: string
          nullable: true
          maxLength: 5000
        reservationAmount:
          type: integer
          nullable: true
          minimum: 0
          description: Optional integer CRC reservation amount; zero valid; no fixed maximum.
        priceNote:
          type: string
          nullable: true
          maxLength: 5000
          description: Optional free text; amounts are not parsed.

    RecipeBook:
      type: object
      required:
        - id
        - courseId
        - title
        - fileName
        - contentType
        - sizeBytes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        courseId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          example: Recetario de Masas y Cremas
        fileName:
          type: string
          example: recetario_masas_cremas.pdf
        contentType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          example: 1048576
        createdAt:
          type: string
          format: date-time
          example: "2026-10-16T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-16T12:00:00.000Z"

    PublicCourse:
      type: object
      required:
        - id
        - name
        - summary
        - description
        - imageUrl
        - learningOutcomes
        - requiredMaterials
        - capacity
        - price
        - instructor
        - schedule
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Repostería Básica
        summary:
          type: string
          example: Aprende técnicas básicas para preparar pasteles.
        description:
          type: string
          example: Un curso práctico para principiantes.
        imageUrl:
          type: string
          nullable: true
          example: https://example.com/imagen.jpg
        learningOutcomes:
          type: array
          items:
            type: string
        requiredMaterials:
          type: array
          items:
            type: string
        capacity:
          type: integer
          nullable: true
          example: 8
        price:
          type: integer
          nullable: true
          example: 35000
        instructor:
          type: string
          nullable: true
          example: Yamilena Blanco Chaves
        schedule:
          $ref: "#/components/schemas/CourseSchedule"


